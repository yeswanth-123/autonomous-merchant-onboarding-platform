{% extends "auth_layout.html" %}
{% import "_ui.html" as ui with context %}

{% block title %}Sign in{% endblock %}

{% block body %}
  <h1>Welcome back</h1>
  <p class="muted mb">Sign in to continue.</p>

  {% if error %}
    <div class="alert tone-danger">
      <span class="ic">⚠️</span>
      <div>{{ error }}</div>
    </div>
  {% endif %}

  <form method="post" action="/login" novalidate>
    {{ ui.csrf_field() }}
    <input type="hidden" name="next" value="{{ next_url }}">

    <div class="mb">
      <label class="f" for="email">Email</label>
      <input id="email"
             name="email"
             type="email"
             value="{{ email }}"
             autocomplete="username"
             required
             autofocus>
    </div>

    <div class="mb">
      <label class="f" for="password">Password</label>
      <div class="pw">
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>
        <button type="button" class="ghost" data-toggle-password="password">Show</button>
      </div>
    </div>

    <button class="block" type="submit">Sign in</button>
  </form>

  <p class="muted small mt">New merchant? <a href="/signup">Create an account</a></p>

{% endblock %}
